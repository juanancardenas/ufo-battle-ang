<section class="card">
  <div class="card-title">
    <img src="/assets/img/register.png" alt="Register" width="32" height="32">
    <h2>Register a new user</h2>
  </div>
  <form class="grid" id="reg-form" novalidate>
    <label for="reg-user">User</label>
    <input id="reg-user" name="user" type="text" required autocomplete="user" />
    <label for="reg-email">Email</label>
    <input id="reg-email" name="email" type="email" required autocomplete="email" />
    <label for="reg-pass">Password</label>
    <input id="reg-pass" name="password" type="password" required minlength="8" autocomplete="new-password" />
    <label for="reg-repeat-pass">Repeat password</label>
    <input id="reg-repeat-pass" name="password" type="password" required minlength="8" autocomplete="new-password" />
    <button class="primary" id="send_register" type="submit">Send</button>
  </form>
</section>
