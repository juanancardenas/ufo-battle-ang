<section class="card">
<div class="card-title">
  <img src="/assets/img/preferences.png" alt="Preferences" width="32" height="32">
  <h2>Preferences</h2>
</div>
<form class="grid" id="pref-form">
  <label for="numberUfo">Number of UFOs: </label>
  <select id="numberUfo" name="numberUfo">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
  </select>
  
  <label for="time">Time (seconds): </label>
  <select id="time" name="time">
    <option value="60">60</option>
    <option value="120">120</option>
    <option value="180">180</option>
  </select>

  <button class="primary" id="ok_preferences" type="button">Go!</button>
</form>
</section>
